services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinica-vida-devops:1.0
    container_name: devops-reservas-web
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
